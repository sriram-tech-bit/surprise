<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A butterfly for you</title>
<style>
:root{--bg1:#1b1440;--bg2:#3a1f5c;--ink:#f6e9ff;--soft:#c9b4e6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg1:#1b1440;--bg2:#3a1f5c;--ink:#f6e9ff;--soft:#c9b4e6}}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--bg1:#fbeaf6;--bg2:#e6d9ff;--ink:#3b1d63;--soft:#6b4a95}}
:root[data-theme="dark"]{--bg1:#1b1440;--bg2:#3a1f5c;--ink:#f6e9ff;--soft:#c9b4e6}
html,body{height:100%;margin:0}
body{background:radial-gradient(120% 90% at 50% 100%,var(--bg2),var(--bg1));color:var(--ink);font-family:Georgia,"Times New Roman",serif;overflow:hidden;touch-action:manipulation;cursor:pointer;-webkit-tap-highlight-color:transparent}
canvas{position:fixed;inset:0;width:100%;height:100%}
.msg{position:fixed;left:0;right:0;top:calc(14vh + env(safe-area-inset-top,0px));text-align:center;padding:0 24px;pointer-events:none}
h1{font-weight:400;font-style:italic;font-size:clamp(30px,7vw,56px);margin:0 0 10px;letter-spacing:.01em}
p.big{color:var(--ink);font-size:clamp(20px,5vw,28px);margin-bottom:14px}
.pop{position:fixed;left:0;right:0;bottom:calc(9vh + env(safe-area-inset-bottom,0px));text-align:center;padding:0 20px;pointer-events:none;font-size:clamp(20px,5vw,28px);font-style:italic;transition:opacity .5s;opacity:0;z-index:6}
.pop.on{opacity:1}
.pop button{pointer-events:auto;margin-top:14px;font:inherit;font-style:normal;color:#fff;background:linear-gradient(135deg,#ff5f8d,#7a5cff);border:0;border-radius:999px;padding:12px 30px;cursor:pointer;box-shadow:0 6px 24px rgba(255,95,141,.45)}
.pop button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.spark{position:fixed;pointer-events:none;font-size:14px;animation:fade .9s ease-out forwards}
@keyframes fade{to{opacity:0;transform:translateY(24px) scale(.3)}}
.heart{position:fixed;pointer-events:none;font-size:26px;animation:rise 1.8s ease-out forwards;z-index:5}
@keyframes rise{from{opacity:1;transform:translate(0,0) scale(.6)}to{opacity:0;transform:translate(var(--dx),-140px) scale(1.3)}}
p{margin:0;color:var(--soft);font-size:clamp(15px,3.6vw,19px);transition:opacity .6s}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="pop" id="pop"></div>
<div class="msg"><h1>Sorry, Siri bangaru 💖</h1><p class="big">I love you ❤️<br>Nee meeda naaku kopam kaadu, I love you 💕</p><p id="hint">Tap anywhere and a butterfly will fly to you 🦋</p></div>
<script>
(function(){
var cv=document.getElementById('c'),ctx=cv.getContext('2d'),W,H,dpr=Math.min(window.devicePixelRatio||1,2);
var reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function size(){W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}
size();addEventListener('resize',size);
var palettes=[['#ff7ac8','#7a5cff','#ffd36e'],['#5ee7e0','#6a7bff','#fff1a8'],['#ffb36b','#ff5f8d','#fff0c9'],['#b58cff','#ff8fd8','#9ff3ff']];
var flies=[];
function make(x,y,s,i){return{x:x,y:y,tx:x,ty:y,s:s,ph:Math.random()*6,rot:0,pal:palettes[i%palettes.length],wander:0}}
flies.push(make(W/2,H+60,1.5,0));flies[0].tx=W/2;flies[0].ty=H*0.62;
var hint=document.getElementById('hint');
function wing(f,side,flap){
  var c=f.pal;ctx.save();ctx.scale(side*flap,1);
  var g=ctx.createLinearGradient(0,-60,70,40);g.addColorStop(0,c[0]);g.addColorStop(.6,c[1]);g.addColorStop(1,c[2]);
  ctx.fillStyle=g;
  ctx.beginPath();ctx.moveTo(3,-4);ctx.bezierCurveTo(30,-95,95,-85,82,-30);ctx.bezierCurveTo(78,-8,35,0,3,-4);ctx.fill();
  ctx.beginPath();ctx.moveTo(3,0);ctx.bezierCurveTo(40,2,75,14,62,48);ctx.bezierCurveTo(50,72,18,52,3,6);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.55)';
  ctx.beginPath();ctx.arc(58,-42,6,0,7);ctx.fill();ctx.beginPath();ctx.arc(44,30,4,0,7);ctx.fill();
  ctx.strokeStyle='rgba(30,10,60,.35)';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(6,-4);ctx.quadraticCurveTo(45,-40,78,-34);ctx.stroke();
  ctx.restore();
}
function draw(f,t){
  var flap=reduce?0.75:Math.abs(Math.cos(f.ph))*0.85+0.15;
  ctx.save();ctx.translate(f.x,f.y);ctx.rotate(f.rot);ctx.scale(f.s*.55,f.s*.55);
  ctx.shadowColor=f.pal[0];ctx.shadowBlur=24;
  wing(f,1,flap);wing(f,-1,flap);
  ctx.shadowBlur=0;ctx.fillStyle='#2a1446';
  ctx.beginPath();ctx.ellipse(0,0,5,32,0,0,7);ctx.fill();
  ctx.strokeStyle='#2a1446';ctx.lineWidth=2;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(-2,-30);ctx.quadraticCurveTo(-14,-52,-22,-54);ctx.moveTo(2,-30);ctx.quadraticCurveTo(14,-52,22,-54);ctx.stroke();
  ctx.restore();
}
var last=0;
function frame(t){
  var dt=Math.min((t-last)/16.7,3)||1;last=t;
  ctx.clearRect(0,0,W,H);
  flies.forEach(function(f,i){
    f.wander+=0.02*dt;
    var wx=Math.sin(f.wander*1.3+i)*16,wy=Math.cos(f.wander+i*2)*12;
    var dx=f.tx+wx-f.x,dy=f.ty+wy-f.y,d=Math.hypot(dx,dy);
    var sp=d>40?0.06:0.04;
    f.x+=dx*sp*dt;f.y+=dy*sp*dt;
    f.ph+=(d>60?0.55:0.28)*dt;
    var want=Math.max(-0.5,Math.min(0.5,dx*0.004));
    f.rot+=(want-f.rot)*0.08;
    draw(f,t);
  });
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
var taps=0;
function tap(e){
  var x=e.clientX,y=e.clientY;
  taps++;
  if(taps===3)say('You are my Siri bangaru 🥰');
  if(taps===8)ask();
  if(taps===5){heartFormation(x,y);hint.style.opacity=0;return}
  flies[0].tx=x;flies[0].ty=y-30;
  if(taps>1&&flies.length<10){
    var n=make(Math.random()<.5?-40:W+40,H*Math.random(),0.7+Math.random()*0.5,flies.length);
    n.tx=x+(Math.random()-.5)*160;n.ty=y+(Math.random()-.5)*120;flies.push(n);
  }
  flies.slice(1).forEach(function(f){f.tx=x+(Math.random()-.5)*220;f.ty=y+(Math.random()-.5)*160});
  hearts(x,y);hint.style.opacity=0;
  if(taps===1)setTimeout(function(){hint.textContent='Tap again for more 💕';hint.style.opacity=1},1800);
}
function hearts(x,y){
  var s=['❤️','💖','💕','💗','💜','💞'];
  for(var i=0;i<7;i++){
    var h=document.createElement('span');h.className='heart';
    h.textContent=s[Math.floor(Math.random()*s.length)];
    h.style.left=(x+(Math.random()-.5)*60)+'px';h.style.top=(y+(Math.random()-.5)*30)+'px';
    h.style.setProperty('--dx',((Math.random()-.5)*120)+'px');
    h.style.animationDelay=(i*0.06)+'s';
    document.body.appendChild(h);
    setTimeout(function(el){el.remove()},2200,h);
  }
}
var pop=document.getElementById('pop'),popT;
function say(html,keep){
  pop.innerHTML=html;pop.classList.add('on');clearTimeout(popT);
  if(!keep)popT=setTimeout(function(){pop.classList.remove('on')},3200);
}
function heartFormation(x,y){
  while(flies.length<14){flies.push(make(Math.random()<.5?-40:W+40,H*Math.random(),0.6,flies.length))}
  var cx=W/2,cy=H*0.62,sc=Math.min(W,H)/46;
  flies.forEach(function(f,i){
    var t=i/flies.length*Math.PI*2;
    f.tx=cx+sc*16*Math.pow(Math.sin(t),3);
    f.ty=cy-sc*(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t));
  });
  hearts(cx,cy);say('The butterflies made a heart for you 💗');
}
function ask(){
  say('Will you forgive me? 🥺<br><button id="yes">Yes 💖</button>',true);
  var b=document.getElementById('yes');
  b.addEventListener('pointerdown',function(e){e.stopPropagation()});
  b.addEventListener('click',function(){
    say('Thank you, Siri bangaru! I love you 💖💖💖',true);
    for(var i=0;i<18;i++)setTimeout(function(){hearts(Math.random()*W,H*0.3+Math.random()*H*0.5)},i*140);
  });
}
var lastSp=0;
document.addEventListener('pointermove',function(e){
  var n=Date.now();if(n-lastSp<45||reduce)return;lastSp=n;
  var s=document.createElement('span');s.className='spark';
  s.textContent=Math.random()<.6?'✨':'💖';
  s.style.left=e.clientX+'px';s.style.top=e.clientY+'px';
  document.body.appendChild(s);setTimeout(function(){s.remove()},950);
});
document.addEventListener('pointerdown',tap);
})();
</script>
</body>
</html>
